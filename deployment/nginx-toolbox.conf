# Include within nginx's http block. Cloudflared targets 127.0.0.1:8080;
# the application listens on 127.0.0.1:8081 and trusts only this proxy.
limit_conn_zone $binary_remote_addr zone=toolbox_connections:10m;
limit_req_zone $binary_remote_addr zone=toolbox_requests:10m rate=5r/s;
limit_conn_zone $server_name zone=toolbox_total:1m;

server {
    listen 127.0.0.1:8080;
    server_name _;
    # Only accept client identity from the local, trusted Cloudflare Tunnel.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;
    access_log off; # Download paths are bearer capabilities.
    error_log /var/log/nginx/toolbox-error.log crit;
    client_max_body_size 201m;
    client_header_timeout 15s;
    client_body_timeout 30s;
    send_timeout 30s;
    keepalive_timeout 15s;
    limit_conn toolbox_connections 4;
    limit_conn toolbox_total 128;
    limit_req zone=toolbox_requests burst=20 nodelay;
    limit_req_status 429;
    limit_conn_status 429;
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_request_buffering off;
        proxy_read_timeout 650s;
        proxy_send_timeout 30s;
        proxy_cache off;
    }
}
