name: Full release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag matching Cargo.toml, for example v0.1.0'
        type: string
        required: true
      draft:
        description: 'Create a draft release for review before publication'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: full-release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: python scripts/release.py prepare

  release:
    needs: prepare
    uses: ./.github/workflows/build-release.yml
    permissions:
      contents: write
    with:
      tag: ${{ inputs.tag }}
      nightly: false
      draft: ${{ inputs.draft }}
