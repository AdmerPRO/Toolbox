name: Dependency security audit
on:
  push:
    paths: ['Cargo.toml', 'Cargo.lock', '.github/workflows/security-audit.yml']
  pull_request:
    paths: ['Cargo.toml', 'Cargo.lock', '.github/workflows/security-audit.yml']
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo install cargo-audit --locked
      - run: cargo audit --deny warnings
