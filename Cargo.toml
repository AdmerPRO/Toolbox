[package]
name = "admersite"
version = "0.1.0"
edition = "2024"

[dependencies]

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP server
axum = { version = "0.8", features = ["multipart", "ws"] }
tower = "0.5"
tower-http = { version = "0.7.0", features = ["cors", "trace", "limit", "fs"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# HTTP client
reqwest = { version = "0.13.4", features = ["json", "stream", "multipart"] }

# Async streams
futures = "0.3"
tokio-stream = "0.1"

# UUID
uuid = { version = "1", features = ["v4", "serde"] }

# Errors
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Environment variables / .env
dotenvy = "0.15"

# Paths / files
walkdir = "2"
tempfile = "3"

# Date & time
chrono = { version = "0.4", features = ["serde"] }

# MIME types
mime = "0.3"

# Hashing
sha = "1.0.3"

# Image processing
image = "0.25"

# Concurrent data structures
dashmap = "6"

# Youtube downloading
yt-dlp = "2.8.2"